name: Update prices

on:
  schedule:
    - cron: "1 21 * * *"
    - cron: "1 6 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium

      - name: Update prices
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_APP_SIGNATURE: ${{ secrets.ALIEXPRESS_APP_SIGNATURE }}
          ALIEXPRESS_TARGET_CURRENCY: RUB
          ALIEXPRESS_TARGET_LANGUAGE: RU
          ALIEXPRESS_COUNTRY: RU
        run: python scripts/update_prices.py

      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update product prices"
          file_pattern: data/products.json data/prices.json
