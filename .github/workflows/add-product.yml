name: Add product from issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
  workflow_dispatch:
    inputs:
      event_path:
        description: Optional local event path for manual debugging
        required: false

permissions:
  contents: write
  issues: write

jobs:
  add-product:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      (startsWith(github.event.issue.title, 'Add product') || startsWith(github.event.issue.title, 'Добавить товар'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add product
        id: add_product
        run: python scripts/add_product_request.py "$GITHUB_EVENT_PATH"

      - name: Commit product data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add product to price monitor"
          file_pattern: data/products.json data/prices.json

      - name: Close request
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.add_product.outputs.result }}';
            const productId = '${{ steps.add_product.outputs.product_id }}';
            const text = result === 'exists'
              ? `Товар уже есть в мониторинге: ${productId}. Я убедился, что он активен.`
              : `Товар добавлен в мониторинг: ${productId}. Первый замер записан в историю.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
