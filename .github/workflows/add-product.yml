name: Add product

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Ссылка на карточку товара"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium

      - name: Add product
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          ALIEXPRESS_APP_SIGNATURE: ${{ secrets.ALIEXPRESS_APP_SIGNATURE }}
          ALIEXPRESS_TARGET_CURRENCY: RUB
          ALIEXPRESS_TARGET_LANGUAGE: RU
          ALIEXPRESS_COUNTRY: RU
        run: python scripts/add_product.py "$PRODUCT_URL"

      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Add product"
          file_pattern: data/products.json data/prices.json
