name: Add product

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Ссылка на карточку товара"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add product
        run: python scripts/add_product.py "${{ inputs.product_url }}"

      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add product"
          file_pattern: data/products.json data/prices.json
