<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price Monitor</title>
    <link rel="stylesheet" href="styles.css?v=20260829-actions">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Price Monitor">Price Monitor</a>
        <div class="top-meta">
          <span>00:01</span>
          <span>09:01</span>
          <span>20:00 МСК</span>
          <button class="ghost-button" id="refreshButton" type="button">Обновить цены</button>
          <span class="status-pill" id="dataStatus">Загрузка</span>
        </div>
      </header>

      <section class="control-bar" aria-label="Добавление товара">
        <form class="add-form" id="addProductForm">
          <label class="url-field" for="productUrl">
            <span>Новая карточка</span>
            <input id="productUrl" name="productUrl" type="url" placeholder="https://www.wildberries.ru/catalog/..." autocomplete="url" required>
          </label>
          <button type="submit" id="addProductButton">Добавить</button>
        </form>
        <p class="note" id="addProductNote" aria-live="polite"></p>
      </section>

      <section class="sheet" aria-label="Таблица цен">
        <div class="sheet-toolbar">
          <div>
            <h1>Товары</h1>
            <p id="tableSummary">Загрузка наблюдений</p>
          </div>
          <div class="marketplaces" aria-label="Поддерживаемые площадки">
            <span>WB</span>
            <span>Ozon</span>
            <span>Маркет</span>
            <span>AliExpress</span>
          </div>
        </div>

        <div class="price-table-wrap">
          <table class="price-table">
            <thead id="priceTableHead"></thead>
            <tbody id="priceTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260829-actions"></script>
  </body>
</html>
