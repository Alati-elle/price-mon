<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price Monitor</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Price Monitor</h1>
          <p>Минималистичная таблица наблюдения за ценами</p>
        </div>
        <div class="status-pill" id="dataStatus">Загрузка</div>
      </header>

      <section class="add-strip" aria-label="Добавление товара">
        <form id="addProductForm">
          <label for="productUrl">Новая карточка</label>
          <div class="input-row">
            <input id="productUrl" name="productUrl" type="url" placeholder="Вставьте ссылку на товар" autocomplete="url" required>
            <button type="submit">Добавить</button>
          </div>
        </form>
        <p class="note" id="addProductNote">Добавление на странице создаёт локальный черновик. Для регулярного мониторинга товар должен быть сохранён в репозитории.</p>
      </section>

      <section class="table-panel" aria-label="Таблица цен">
        <div class="table-headline">
          <div>
            <h2>Товары</h2>
            <p id="tableSummary">Загрузка наблюдений</p>
          </div>
          <div class="marketplaces" aria-label="Поддерживаемые площадки">
            <span>WB</span>
            <span>Ozon</span>
            <span>Маркет</span>
            <span>AliExpress</span>
          </div>
        </div>

        <div class="price-table-wrap">
          <table class="price-table">
            <thead id="priceTableHead"></thead>
            <tbody id="priceTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
